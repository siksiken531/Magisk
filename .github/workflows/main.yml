name: Build Magisk Nova

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Magisk Binaries and APK
        run: |
          ./build.py all
          ./gradlew assembleRelease

      - name: Upload Magisk Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-32.8-Release
          path: |
            out/*.apk
            app/apk/build/outputs/apk/release/*.apk
            
